name: Defi Workflow

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  # Parallel Job 1: Linting
  linting:
    runs-on: ubuntu-latest
    matrix:
        node-version: [20.x]
    steps:
      - name: Linting step 1
        run: echo "Linting step 1"
      - name: Linting step 2
        run: echo "Linting step 2"
      - name: Linting step 3
        run: echo "Linting step 3"

  # Parallel Job 2: Dependency Test
  dependency-test:
    runs-on: ubuntu-latest
    matrix:
        node-version: [20.x]
    steps:
      - name: Dependency test step 1
        run: echo "Dependency test step 1"
      - name: Dependency test step 2
        run: echo "Dependency test step 2"
      - name: Dependency test step 3
        run: echo "Dependency test step 3"

  # Parallel Job 3: Unit Test
  unit-test:
    runs-on: ubuntu-latest
    matrix:
        node-version: [20.x]
    steps:
      - name: Unit test step 1
        run: echo "Unit test step 1"
      - name: Unit test step 2
        run: echo "Unit test step 2"
      - name: Unit test step 3
        run: echo "Unit test step 3"
