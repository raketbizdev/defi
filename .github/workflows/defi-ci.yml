name: Defi Workflow

on:
  workflow_dispatch:
  push:
    branches: ["dev"]
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-env:
    name: Setup Env
    runs-on: ubuntu-latest
    outputs:
      node_versions: ${{ steps.set.outputs.node_versions }}
      precheck_lanes: ${{ steps.set.outputs.precheck_lanes }}
      dev_test_lanes: ${{ steps.set.outputs.dev_test_lanes }}
      uat_validation_lanes: ${{ steps.set.outputs.uat_validation_lanes }}
    steps:
      - name: Setup placeholders
        run: |
          echo "Setup Env"
          echo "Branch: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"

      - id: set
        name: Define matrices
        run: |
          echo 'node_versions=["20.x"]' >> "$GITHUB_OUTPUT"
          echo 'precheck_lanes=["upload-static-to-s3","linting","dependency-package-check","unit-test-coverage","db-integration-test"]' >> "$GITHUB_OUTPUT"
          echo 'dev_test_lanes=["smoke-test-postman","api-e2e-test"]' >> "$GITHUB_OUTPUT"
          echo 'uat_validation_lanes=["performance-test","apm-test"]' >> "$GITHUB_OUTPUT"

  prechecks:
    name: Parallel Prechecks
    runs-on: ubuntu-latest
    needs: setup-env
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.setup-env.outputs.node_versions) }}
        lane: ${{ fromJSON(needs.setup-env.outputs.precheck_lanes) }}
    steps:
      - name: Checkout
        run: echo "Checkout repository"

      - name: Setup Node
        run: echo "Setup Node ${{ matrix.node-version }}"

      - name: Lane banner
        run: |
          echo "Parallel Prechecks"
          echo "Lane: ${{ matrix.lane }}"
          echo "Node: ${{ matrix.node-version }}"

      - name: Upload Static Asset to S3
        if: ${{ matrix.lane == 'upload-static-to-s3' }}
        run: |
          echo "Upload Static Asset to S3"
          echo "Template only"

      - name: Linting
        if: ${{ matrix.lane == 'linting' }}
        run: |
          echo "Linting"
          echo "Template only"

      - name: Dependency package Check
        if: ${{ matrix.lane == 'dependency-package-check' }}
        run: |
          echo "Dependency package Check"
          echo "Template only"

      - name: Unit Test Coverage
        if: ${{ matrix.lane == 'unit-test-coverage' }}
        run: |
          echo "Unit Test Coverage"
          echo "Template only"

      - name: DB Integration Test
        if: ${{ matrix.lane == 'db-integration-test' }}
        run: |
          echo "DB Integration Test"
          echo "Template only"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: prechecks
    steps:
      - name: Build
        run: |
          echo "Build"
          echo "Template only"

  deploy-dev:
    name: Deploy To Dev
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    steps:
      - name: Deploy To Dev
        run: |
          echo "Deploy To Dev"
          echo "Template only"

  dev-tests:
    name: Parallel Dev Tests
    runs-on: ubuntu-latest
    needs: deploy-dev
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.setup-env.outputs.dev_test_lanes) }}
    steps:
      - name: Lane banner
        run: |
          echo "Parallel Dev Tests"
          echo "Lane: ${{ matrix.lane }}"

      - name: Smoke Test Postman
        if: ${{ matrix.lane == 'smoke-test-postman' }}
        run: |
          echo "Smoke Test Postman"
          echo "Template only"

      - name: API e2e Test
        if: ${{ matrix.lane == 'api-e2e-test' }}
        run: |
          echo "API e2e Test"
          echo "Template only"

  deploy-uat:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    needs: dev-tests
    environment: uat
    steps:
      - name: Deploy to UAT
        run: |
          echo "Deploy to UAT"
          echo "Template only"

  uat-validations:
    name: Parallel UAT Validations
    runs-on: ubuntu-latest
    needs: deploy-uat
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.setup-env.outputs.uat_validation_lanes) }}
    steps:
      - name: Lane banner
        run: |
          echo "Parallel UAT Validations"
          echo "Lane: ${{ matrix.lane }}"

      - name: Performance Test
        if: ${{ matrix.lane == 'performance-test' }}
        run: |
          echo "Performance Test"
          echo "Template only"

      - name: APM Test
        if: ${{ matrix.lane == 'apm-test' }}
        run: |
          echo "APM Test"
          echo "Template only"

  deploy-prod:
    name: Deploy to prod
    runs-on: ubuntu-latest
    needs: uat-validations
    environment: prod
    steps:
      - name: Deploy to prod
        run: |
          echo "Deploy to prod"
          echo "Template only"
