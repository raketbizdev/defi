name: Defi CI/CD Workflow

on:
  push:
    branches:
      - dev

jobs:
  setup-env:
    runs-on: ubuntu-latest
    steps:
      - name: Setup environment
        run: echo "Setup Env"

  upload-static-to-s3:
    runs-on: ${{ matrix.os }}
    needs: setup-env
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Upload static asset 1
        run: echo "Upload static asset to S3 - step 1"
      - name: Upload static asset 2
        run: echo "Upload static asset to S3 - step 2"
      - name: Upload static asset 3
        run: echo "Upload static asset to S3 - step 3"

  linting:
    runs-on: ${{ matrix.os }}
    needs: setup-env
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Lint step 1
        run: echo "Linting step 1"
      - name: Lint step 2
        run: echo "Linting step 2"
      - name: Lint step 3
        run: echo "Linting step 3"

  dependency-package-check:
    runs-on: ${{ matrix.os }}
    needs: setup-env
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Dependency check step 1
        run: echo "Dependency check step 1"
      - name: Dependency check step 2
        run: echo "Dependency check step 2"
      - name: Dependency check step 3
        run: echo "Dependency check step 3"

  unit-test-coverage:
    runs-on: ${{ matrix.os }}
    needs: setup-env
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Unit test step 1
        run: echo "Unit test coverage step 1"
      - name: Unit test step 2
        run: echo "Unit test coverage step 2"
      - name: Unit test step 3
        run: echo "Unit test coverage step 3"

  db-integration-test:
    runs-on: ${{ matrix.os }}
    needs: setup-env
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: DB integration test step 1
        run: echo "DB integration test step 1"
      - name: DB integration test step 2
        run: echo "DB integration test step 2"
      - name: DB integration test step 3
        run: echo "DB integration test step 3"

  build:
    runs-on: ubuntu-latest
    needs:
      - upload-static-to-s3
      - linting
      - dependency-package-check
      - unit-test-coverage
      - db-integration-test
    steps:
      - name: Build step 1
        run: echo "Build step 1"
      - name: Build step 2
        run: echo "Build step 2"
      - name: Build step 3
        run: echo "Build step 3"

  deploy-to-dev:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to dev
        run: echo "Deploy to Dev"

  smoke-test-postman:
    runs-on: ${{ matrix.os }}
    needs: deploy-to-dev
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Smoke test step 1
        run: echo "Smoke test Postman step 1"
      - name: Smoke test step 2
        run: echo "Smoke test Postman step 2"

  api-e2e-test:
    runs-on: ${{ matrix.os }}
    needs: deploy-to-dev
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: API e2e step 1
        run: echo "API e2e test step 1"
      - name: API e2e step 2
        run: echo "API e2e test step 2"

  deploy-to-uat:
    runs-on: ubuntu-latest
    needs:
      - smoke-test-postman
      - api-e2e-test
    steps:
      - name: Deploy to UAT
        run: echo "Deploy to UAT"

  performance-test:
    runs-on: ${{ matrix.os }}
    needs: deploy-to-uat
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Performance test step 1
        run: echo "Performance test step 1"
      - name: Performance test step 2
        run: echo "Performance test step 2"

  apm-test:
    runs-on: ${{ matrix.os }}
    needs: deploy-to-uat
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: APM test step 1
        run: echo "APM test step 1"
      - name: APM test step 2
        run: echo "APM test step 2"

  deploy-to-prod:
    runs-on: ubuntu-latest
    needs:
      - performance-test
      - apm-test
    steps:
      - name: Deploy to prod
        run: echo "Deploy to prod"
