name: Defi Workflow

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Setup Env
  setup-env:
    name: Setup Env
    runs-on: ubuntu-latest
    outputs:
      node_versions: ${{ steps.set.outputs.node_versions }}
      precheck_lanes: ${{ steps.set.outputs.precheck_lanes }}
    steps:
      - name: Setup env placeholders
        run: |
          echo "Setup Env"
          echo "Branch: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"

      # Single source of truth for all matrix values (DRY).
      - id: set
        name: Define matrices
        run: |
          echo 'node_versions=["20.x"]' >> "$GITHUB_OUTPUT"
          echo 'precheck_lanes=["upload-static-to-s3","linting","dependency-package-check","unit-test-coverage","db-integration-test"]' >> "$GITHUB_OUTPUT"

  # 2. Parallel prechecks block (each item is its own matrix lane)
  prechecks-parallel:
    name: Prechecks (Parallel)
    runs-on: ubuntu-latest
    needs: setup-env
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.setup-env.outputs.node_versions) }}
        lane: ${{ fromJSON(needs.setup-env.outputs.precheck_lanes) }}
    steps:
      - name: Lane banner
        run: |
          echo "Precheck lane: ${{ matrix.lane }}"
          echo "Node: ${{ matrix.node-version }}"

      - name: Upload Static Asset to S3 (template)
        if: ${{ matrix.lane == 'upload-static-to-s3' }}
        run: |
          echo "Upload Static Asset to S3"
          echo "Template only. No AWS credentials yet"
          echo "Later: aws s3 sync <local_dir> s3://<bucket>/<prefix> --delete"

      - name: Linting (template)
        if: ${{ matrix.lane == 'linting' }}
        run: |
          echo "Linting"
          echo "Template only"
          echo "Later: npm ci"
          echo "Later: npm run lint"

      - name: Dependency package Check (template)
        if: ${{ matrix.lane == 'dependency-package-check' }}
        run: |
          echo "Dependency package Check"
          echo "Template only"
          echo "Later: npm ci"
          echo "Later: npm audit --audit-level=high"

      - name: Unit Test Coverage (template)
        if: ${{ matrix.lane == 'unit-test-coverage' }}
        run: |
          echo "Unit Test Coverage"
          echo "Template only"
          echo "Later: npm ci"
          echo "Later: npm run test:unit"
          echo "Later: npm run test:coverage"

      - name: DB Integration Test (template)
        if: ${{ matrix.lane == 'db-integration-test' }}
        run: |
          echo "DB Integration Test"
          echo "Template only"
          echo "Later: start DB service"
          echo "Later: npm run test:db"

  # 3. Build
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: prechecks-parallel
    steps:
      - name: Build (template)
        run: |
          echo "Build"
          echo "Template only"
          echo "Later: npm ci"
          echo "Later: npm run build"

  # 4. Deploy To Dev
  deploy-dev:
    name: Deploy To Dev
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    steps:
      - name: Deploy To Dev (template)
        run: |
          echo "Deploy To Dev"
          echo "Template only"
          echo "Later: deploy commands"

  # 5. Parallel: Smoke Test Postman + API e2e Test
  dev-tests-parallel:
    name: Dev Tests (Parallel)
    runs-on: ubuntu-latest
    needs: deploy-dev
    strategy:
      fail-fast: false
      matrix:
        lane: [smoke-test-postman, api-e2e-test]
    steps:
      - name: Lane banner
        run: |
          echo "Dev test lane: ${{ matrix.lane }}"

      - name: Smoke Test Postman (template)
        if: ${{ matrix.lane == 'smoke-test-postman' }}
        run: |
          echo "Smoke Test Postman"
          echo "Template only"
          echo "Later: newman run <collection.json> -e <env.json>"

      - name: API e2e Test (template)
        if: ${{ matrix.lane == 'api-e2e-test' }}
        run: |
          echo "API e2e Test"
          echo "Template only"
          echo "Later: npm run test:e2e"

  # 6. Deploy to UAT
  deploy-uat:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    needs: dev-tests-parallel
    environment: uat
    steps:
      - name: Deploy to UAT (template)
        run: |
          echo "Deploy to UAT"
          echo "Template only"
          echo "Later: deploy commands"

  # 7. Parallel: Performance Test + APM Test
  uat-validations-parallel:
    name: UAT Validations (Parallel)
    runs-on: ubuntu-latest
    needs: deploy-uat
    strategy:
      fail-fast: false
      matrix:
        lane: [performance-test, apm-test]
    steps:
      - name: Lane banner
        run: |
          echo "UAT validation lane: ${{ matrix.lane }}"

      - name: Performance Test (template)
        if: ${{ matrix.lane == 'performance-test' }}
        run: |
          echo "Performance Test"
          echo "Template only"
          echo "Later: k6 run <script.js>"

      - name: APM Test (template)
        if: ${{ matrix.lane == 'apm-test' }}
        run: |
          echo "APM Test"
          echo "Template only"
          echo "Later: validate APM signals"

  # 8. Deploy to prod
  deploy-prod:
    name: Deploy to prod
    runs-on: ubuntu-latest
    needs: uat-validations-parallel
    environment: prod
    steps:
      - name: Deploy to prod (template)
        run: |
          echo "Deploy to prod"
          echo "Template only"
          echo "Later: deploy commands"
