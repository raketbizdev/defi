name: Defi Workflow

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-env:
    name: Setup Env
    runs-on: ubuntu-latest
    outputs:
      node_versions: ${{ steps.matrix.outputs.node_versions }}
    steps:
      - name: Setup
        run: |
          echo "Setup Env"
          echo "Branch: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"

      # Centralized Node versions. Update here only.
      - id: matrix
        name: Define Node matrix
        run: |
          echo 'node_versions=["20.x"]' >> "$GITHUB_OUTPUT"

  prechecks:
    name: Prechecks (Parallel)
    runs-on: ubuntu-latest
    needs: setup-env
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.setup-env.outputs.node_versions) }}
        lane:
          - upload-static
          - linting
          - dependency-check
          - unit-test-coverage
          - db-integration-test
    steps:
      - name: Banner
        run: |
          echo "Prechecks lane: ${{ matrix.lane }}"
          echo "Node: ${{ matrix.node-version }}"

      - name: Upload Static Asset to S3 (template)
        if: ${{ matrix.lane == 'upload-static' }}
        run: |
          echo "Upload Static Asset to S3"
          echo "Template only. No AWS credentials yet"
          echo "Later: aws s3 sync <local_dir> s3://<bucket>/<prefix> --delete"

      - name: Linting (template)
        if: ${{ matrix.lane == 'linting' }}
        run: |
          echo "Linting"
          echo "Template only"
          echo "Later: npm ci"
          echo "Later: npm run lint"

      - name: Dependency package Check (template)
        if: ${{ matrix.lane == 'dependency-check' }}
        run: |
          echo "Dependency package Check"
          echo "Template only"
          echo "Later: npm ci"
          echo "Later: npm audit --audit-level=high"

      - name: Unit Test Coverage (template)
        if: ${{ matrix.lane == 'unit-test-coverage' }}
        run: |
          echo "Unit Test Coverage"
          echo "Template only"
          echo "Later: npm ci"
          echo "Later: npm run test:unit"
          echo "Later: npm run test:coverage"

      - name: DB Integration Test (template)
        if: ${{ matrix.lane == 'db-integration-test' }}
        run: |
          echo "DB Integration Test"
          echo "Template only"
          echo "Later: start DB service"
          echo "Later: npm run test:db"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: prechecks
    steps:
      - name: Build (template)
        run: |
          echo "Build"
          echo "Template only"
          echo "Later: npm ci"
          echo "Later: npm run build"

  deploy-dev:
    name: Deploy To Dev
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    steps:
      - name: Deploy To Dev (template)
        run: |
          echo "Deploy To Dev"
          echo "Template only"
          echo "Later: deploy commands"

  postman-smoke-and-api-e2e:
    name: Smoke Test Postman + API e2e (Parallel)
    runs-on: ubuntu-latest
    needs: deploy-dev
    strategy:
      fail-fast: false
      matrix:
        lane:
          - smoke-test-postman
          - api-e2e-test
    steps:
      - name: Banner
        run: |
          echo "Post-deploy Dev test lane: ${{ matrix.lane }}"

      - name: Smoke Test Postman (template)
        if: ${{ matrix.lane == 'smoke-test-postman' }}
        run: |
          echo "Smoke Test Postman"
          echo "Template only"
          echo "Later: newman run <collection.json> -e <env.json>"

      - name: API e2e Test (template)
        if: ${{ matrix.lane == 'api-e2e-test' }}
        run: |
          echo "API e2e Test"
          echo "Template only"
          echo "Later: npm run test:e2e"

  deploy-uat:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    needs: postman-smoke-and-api-e2e
    environment: uat
    steps:
      - name: Deploy to UAT (template)
        run: |
          echo "Deploy to UAT"
          echo "Template only"
          echo "Later: deploy commands"

  perf-and-apm:
    name: Performance Test + APM Test (Parallel)
    runs-on: ubuntu-latest
    needs: deploy-uat
    strategy:
      fail-fast: false
      matrix:
        lane:
          - performance-test
          - apm-test
    steps:
      - name: Banner
        run: |
          echo "UAT validation lane: ${{ matrix.lane }}"

      - name: Performance Test (template)
        if: ${{ matrix.lane == 'performance-test' }}
        run: |
          echo "Performance Test"
          echo "Template only"
          echo "Later: k6 run <script.js>"

      - name: APM Test (template)
        if: ${{ matrix.lane == 'apm-test' }}
        run: |
          echo "APM Test"
          echo "Template only"
          echo "Later: validate APM signals. Datadog, NewRelic, etc"

  deploy-prod:
    name: Deploy to prod
    runs-on: ubuntu-latest
    needs: perf-and-apm
    environment: prod
    steps:
      - name: Deploy to prod (template)
        run: |
          echo "Deploy to prod"
          echo "Template only"
          echo "Later: deploy commands"
