name: Defi Workflow

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  # Central place to define node versions once
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      node_versions: ${{ steps.set.outputs.node_versions }}
    steps:
      - id: set
        run: echo 'node_versions=["20.x"]' >> "$GITHUB_OUTPUT"

  # Parallel Job 1: Linting
  linting:
    runs-on: ubuntu-latest
    needs: setup-matrix
    strategy:
      matrix:
        node-version: ${{ fromJSON(needs.setup-matrix.outputs.node_versions) }}
    steps:
      - name: Linting step 1
        run: echo "Linting step 1 (Node ${{ matrix.node-version }})"
      - name: Linting step 2
        run: echo "Linting step 2 (Node ${{ matrix.node-version }})"
      - name: Linting step 3
        run: echo "Linting step 3 (Node ${{ matrix.node-version }})"

  # Parallel Job 2: Dependency Test
  dependency-test:
    runs-on: ubuntu-latest
    needs: setup-matrix
    strategy:
      matrix:
        node-version: ${{ fromJSON(needs.setup-matrix.outputs.node_versions) }}
    steps:
      - name: Dependency test step 1
        run: echo "Dependency test step 1 (Node ${{ matrix.node-version }})"
      - name: Dependency test step 2
        run: echo "Dependency test step 2 (Node ${{ matrix.node-version }})"
      - name: Dependency test step 3
        run: echo "Dependency test step 3 (Node ${{ matrix.node-version }})"

  # Parallel Job 3: Unit Test
  unit-test:
    runs-on: ubuntu-latest
    needs: setup-matrix
    strategy:
      matrix:
        node-version: ${{ fromJSON(needs.setup-matrix.outputs.node_versions) }}
    steps:
      - name: Unit test step 1
        run: echo "Unit test step 1 (Node ${{ matrix.node-version }})"
      - name: Unit test step 2
        run: echo "Unit test step 2 (Node ${{ matrix.node-version }})"
      - name: Unit test step 3
        run: echo "Unit test step 3 (Node ${{ matrix.node-version }})"